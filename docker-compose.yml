services:
  frontend:
    image: ghcr.io/your-org/imp/frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    image: ghcr.io/your-org/imp/backend:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - "3001"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend